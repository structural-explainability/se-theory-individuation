# ============================================================
# Individuation Predicates
# se-theory-individuation
# ============================================================
# Public Prop-valued definitions: whole co-membership, the whole conditions, success, same-unit and distinct-unit judgments, bond generation, and the commitment relations used with Persistence.

schema = "se-predicate-registry-1"
kind = "predicate"
repo = "se-theory-individuation"
surface_module = "SE.Individuation"
namespace = "SE.Individuation"

[predicate.CoMember]
order = 1
id = "CoMember"
cite_id = "IND.DEF.CO_MEMBER"
name = "Co-member"
lean_symbol = "SE.Individuation.Structural.Setting.CoMember"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Setting"
description = "Whole co-membership lifted to all atoms: both atoms are eligible and related by E. It is not strict identity of atoms."

[predicate.WholeConditions]
order = 2
id = "WholeConditions"
cite_id = "IND.DEF.WHOLE_CONDITIONS"
name = "Whole conditions"
lean_symbol = "SE.Individuation.Structural.Setting.WholeConditions"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Whole"
description = "The three whole conditions on a set of atoms: it contains an eligible atom, every two of its atoms are co-members, and every eligible atom co-member with one of its atoms is in it."

[predicate.Succeeds]
order = 3
id = "Succeeds"
cite_id = "IND.DEF.SUCCEEDS"
name = "Succeeds"
lean_symbol = "SE.Individuation.Structural.Setting.Succeeds"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Whole"
description = "A presentation succeeds when it is admissible and its support meets the whole conditions."

[predicate.IsClass]
order = 4
id = "IsClass"
cite_id = "IND.DEF.IS_CLASS"
name = "Is class"
lean_symbol = "SE.Individuation.Structural.Setting.IsClass"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Whole"
description = "A set of atoms is the E-class of some eligible atom."

[predicate.SameUnit]
order = 5
id = "SameUnit"
cite_id = "IND.DEF.SAME_UNIT"
name = "Same unit"
lean_symbol = "SE.Individuation.Structural.Setting.SameUnit"
lean_kind = "def"
source_module = "SE.Individuation.Structural.SameUnit"
description = "Both presentations succeed and their supports are equal. Guarded by success, so not reflexive at a presentation that fails."

[predicate.DistinctUnits]
order = 6
id = "DistinctUnits"
cite_id = "IND.DEF.DISTINCT_UNITS"
name = "Distinct units"
lean_symbol = "SE.Individuation.Structural.Setting.DistinctUnits"
lean_kind = "def"
source_module = "SE.Individuation.Structural.SameUnit"
description = "Both presentations succeed and their supports share no atom."

[predicate.BondGenerated]
order = 7
id = "BondGenerated"
cite_id = "IND.DEF.BOND_GENERATED"
name = "Bond generated"
lean_symbol = "SE.Individuation.Structural.Setting.BondGenerated"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Connectivity"
description = "The co-membership relation E of a setting is the equivalence relation generated by a given bond relation on eligible atoms."

[predicate.SamePairs]
order = 8
id = "SamePairs"
cite_id = "IND.DEF.SAME_PAIRS"
name = "Same pairs"
lean_symbol = "SE.Individuation.Structural.Setting.samePairs"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Commitments"
description = "Same-unit judgments on the subtype of successful presentations, used as the same-commitments in the Persistence connection."

[predicate.DistinctPairs]
order = 9
id = "DistinctPairs"
cite_id = "IND.DEF.DISTINCT_PAIRS"
name = "Distinct pairs"
lean_symbol = "SE.Individuation.Structural.Setting.distinctPairs"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Commitments"
description = "Distinct-unit judgments on the subtype of successful presentations, used as the distinct-commitments in the Persistence connection."

[predicate.SupportEquality]
order = 10
id = "SupportEquality"
cite_id = "IND.DEF.SUPPORT_EQUALITY"
name = "Support equality"
lean_symbol = "SE.Individuation.Structural.Setting.supportEquality"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Commitments"
description = "Equality of supports on successful presentations. It is the relation shown admissible for the same-unit and distinct-unit commitments."
