# ============================================================
# Individuation Vocabulary
# se-theory-individuation
# ============================================================
# Public Lean definitions that are not Prop-valued: the connectivity instance constructor, set transport, the bond-correspondence transport, the support observation map, and the Neutral Substrate adapter.

schema = "se-vocabulary-registry-1"
kind = "vocabulary"
repo = "se-theory-individuation"
surface_module = "SE.Individuation"
namespace = "SE.Individuation"

[vocabulary.OfBonds]
order = 1
id = "OfBonds"
cite_id = "IND.DEF.OF_BONDS"
name = "Of bonds"
lean_symbol = "SE.Individuation.Structural.Setting.ofBonds"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Connectivity"
description = "The connectivity instance: a setting whose whole co-membership is the equivalence relation generated by a given bond relation on eligible atoms. Using it scientifically requires independently justifying why bond-connected atoms belong to the same intended whole."

[vocabulary.EligibleIsoImage]
order = 2
id = "EligibleIsoImage"
cite_id = "IND.DEF.ELIGIBLE_ISO_IMAGE"
name = "Eligible isomorphism image"
lean_symbol = "SE.Individuation.Structural.EligibleIso.image"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Transport"
description = "The image of a set of atoms under an eligible isomorphism: the images of its eligible atoms."

[vocabulary.OfBondCorrespondence]
order = 3
id = "OfBondCorrespondence"
cite_id = "IND.DEF.OF_BOND_CORRESPONDENCE"
name = "Of bond correspondence"
lean_symbol = "SE.Individuation.Structural.EligibleIso.ofBondCorrespondence"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Transport"
description = "For bond-generated settings, a bijection of eligible atoms that preserves and reflects bonds gives an eligible isomorphism."

[vocabulary.SupportObservation]
order = 4
id = "SupportObservation"
cite_id = "IND.DEF.SUPPORT_OBSERVATION"
name = "Support observation"
lean_symbol = "SE.Individuation.Structural.Setting.supportObservation"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Commitments"
description = "The support observation map on successful presentations: each presentation is sent to its support."

[vocabulary.IndividuationAccount]
order = 5
id = "IndividuationAccount"
cite_id = "IND.DEF.INDIVIDUATION_ACCOUNT"
name = "Individuation account"
lean_symbol = "SE.Individuation.Structural.individuationAccount"
lean_kind = "def"
source_module = "SE.Individuation.Structural.Account"
description = "The Neutral Substrate individuation account over set-valued referents: contexts are structural settings, success is the one predicate, and same-unit is the success-guarded support equality. Set-valued referents are a local extensional realization and do not identify carrier equality with identity throughout the framework."
