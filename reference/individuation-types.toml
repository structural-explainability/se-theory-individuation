# ============================================================
# Individuation Types
# se-theory-individuation
# ============================================================
# Public Lean types for the Individuation theory.

schema = "se-type-registry-1"
kind = "type"
repo = "se-theory-individuation"
surface_module = "SE.Individuation"
namespace = "SE.Individuation"

[type.Setting]
order = 1
id = "Setting"
cite_id = "IND.TYPE.SETTING"
name = "Setting"
lean_symbol = "SE.Individuation.Structural.Setting"
lean_kind = "structure"
source_module = "SE.Individuation.Structural.Setting"
description = "A structural setting at a fixed granularity: an eligible domain of atoms, a presentation-admissibility predicate, a support function, and an equivalence relation E on eligible atoms read as whole co-membership. E is not strict identity of atoms."

[type.BondClosure]
order = 2
id = "BondClosure"
cite_id = "IND.TYPE.BOND_CLOSURE"
name = "Bond closure"
lean_symbol = "SE.Individuation.Structural.BondClosure"
lean_kind = "inductive"
source_module = "SE.Individuation.Structural.Connectivity"
description = "The equivalence relation generated by a bond relation. Universe-polymorphic. Its agreement with the generated relation of Persistence at universe 0 is bondClosure_iff_generated."

[type.EligibleIso]
order = 3
id = "EligibleIso"
cite_id = "IND.TYPE.ELIGIBLE_ISO"
name = "Eligible isomorphism"
lean_symbol = "SE.Individuation.Structural.EligibleIso"
lean_kind = "structure"
source_module = "SE.Individuation.Structural.Transport"
description = "A bijection between the eligible domains of two settings that preserves and reflects whole co-membership. It establishes invariance under the stated transport, not strict identity across settings."

[type.PresentationTransport]
order = 4
id = "PresentationTransport"
cite_id = "IND.TYPE.PRESENTATION_TRANSPORT"
name = "Presentation transport"
lean_symbol = "SE.Individuation.Structural.PresentationTransport"
lean_kind = "structure"
source_module = "SE.Individuation.Structural.Transport"
description = "A presentation map over an eligible isomorphism that preserves and reflects admissibility and carries supports to their images."
